plugins {
    id 'java'
    id 'io.qameta.allure' version '2.11.2'
}

group = 'ru.aviasales'
version = '1.0'

repositories {
    mavenCentral()
}

def allureVersion = "2.24.0",
    selenideVersion = "7.16.0",
    junitVersion = "5.10.1",
    restAssuredVersion = "5.4.0",
    ownerVersion = "1.0.12",
    lombokVersion = "1.18.30",
    assertjVersion = "3.24.2",
    jacksonVersion = "2.16.1",
    aspectjWeaverVersion = "1.9.22.1",
    slf4jVersion = "2.0.13"

dependencies {
    testImplementation(
            platform("io.qameta.allure:allure-junit5:$allureVersion"),
            "org.junit.jupiter:junit-jupiter:$junitVersion",
            "io.rest-assured:rest-assured:$restAssuredVersion",
            "io.rest-assured:json-schema-validator:$restAssuredVersion",
            "io.qameta.allure:allure-rest-assured:$allureVersion",
            "io.qameta.allure:allure-selenide:$allureVersion",
            "com.codeborne:selenide:$selenideVersion",
            "com.fasterxml.jackson.core:jackson-databind:$jacksonVersion",
            "org.aeonbits.owner:owner:$ownerVersion",
            "org.projectlombok:lombok:$lombokVersion",
            "org.assertj:assertj-core:$assertjVersion",
            "org.slf4j:slf4j-simple:$slf4jVersion",

    )
    testAnnotationProcessor "org.projectlombok:lombok:$lombokVersion"
    testCompileOnly "org.projectlombok:lombok:$lombokVersion"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

}

allure {
    report {
        version.set(allureVersion)
    }
    adapter {
        aspectjWeaver.set(true)
        // AspectJ обрабатывает @Step. Версия по умолчанию не понимает классы Java 21, нужна 1.9.21+
        aspectjVersion.set(aspectjWeaverVersion)
        frameworks {
            junit5 {
                adapterVersion.set(allureVersion)
            }
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    systemProperties(System.getProperties())
    systemProperty 'file.encoding', 'UTF-8'

    def secretsFromEnv = [
            'TRAVELPAYOUTS_TOKEN': 'travelpayouts.token',
            'REMOTE_URL'         : 'remoteUrl'
    ]
    secretsFromEnv.each { envName, propertyName ->
        def value = System.getenv(envName)
        if (value) {
            systemProperty propertyName, value
        }
    }

    testLogging {
        lifecycle {
            events "started", "skipped", "failed", "standard_error", "standard_out"
            exceptionFormat "short"
        }
    }
}

test {
    useJUnitPlatform()
}

tasks.register('api', Test) {
    description = 'Запуск API-тестов'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags("api")
    }
}

tasks.register('ui', Test) {
    description = 'Запуск UI-тестов'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags("ui")
    }
}